{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in · Campus Marketplace{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Log in</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    {{ csrf() }}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn block" type="submit" data-loading="Logging in…">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
